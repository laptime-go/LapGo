name: Make B64 from uploaded keystore
on: workflow_dispatch
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Encode from root
        run: |
          echo "=== 搵你個file ==="
          ls -lh *.keystore 2>/dev/null
          FILE=$(ls *.keystore | head -n 1)
          echo "Use: $FILE size: $(wc -c < "$FILE")"
          
          echo ""
          echo "=== 試密碼 LapGo2026#40Secure! ==="
          keytool -list -v -keystore "$FILE" -storepass 'LapGo2026#40Secure!' | grep -E "Alias|SHA1|Valid" || echo "密碼唔啱或檔爛，照出B64俾你睇"

          echo ""
          echo "=== 出B64 ==="
          base64 -w 0 "$FILE" > /tmp/b64.txt
          echo "Length: $(wc -c < /tmp/b64.txt) 應該 ~3688"
          echo "TAIL: $(tail -c 30 /tmp/b64.txt)"
          echo ""
          echo "FULL B64 COPY BELOW:"
          cat /tmp/b64.txt
          echo ""
          echo "END"
