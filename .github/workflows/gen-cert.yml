name: Gen Upload Cert
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls -lh release.keystore
          keytool -export -rfc -keystore release.keystore -alias lapgo -file upload_cert.pem -storepass 123456
          keytool -list -v -keystore release.keystore -storepass 123456 | grep -A2 SHA1
          cat upload_cert.pem
      - uses: actions/upload-artifact@v4
        with:
          name: upload_cert
          path: upload_cert.pem
