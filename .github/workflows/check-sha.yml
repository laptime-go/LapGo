name: check-sha
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Check SHA1
        run: |
          keytool -list -v -keystore release.keystore -storepass 123456 -keypass 123456
          echo "---- upload_cert.pem SHA1 ----"
          keytool -printcert -file upload_cert.pem 2>/dev/null || echo "no pem, checking artifacts"
