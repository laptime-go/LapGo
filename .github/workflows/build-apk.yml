name: Build AAB for Play Store
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Expo prebuild clean
        run: npx expo prebuild --clean --no-install

      - name: Generate and Force Release Keystore
        run: |
          cd android
          keytool -genkey -v -keystore release.keystore -alias lapgo -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=LapGo, OU=Dev, O=LapGo, L=HK, S=HK, C=HK"
          cp release.keystore app/release.keystore
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=lapgo" >> gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=123456" >> gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=123456" >> gradle.properties
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=lapgo" >> gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=123456" >> gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=123456" >> gradle.properties
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' app/build.gradle
          cat gradle.properties
