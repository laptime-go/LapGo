name: Build 63 Tracks AAB + APK - 40:0C:73
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Generate tracks if script exists
        run: |
          mkdir -p assets/tracks
          if [ -f scripts/generate-tracks.js ]; then
            sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev || true
            npm install canvas
            node scripts/generate-tracks.js
          else
            echo "No generate script, skip"
          fi
          echo "Have $(ls assets/tracks/*.jpg 2>/dev/null | wc -l) images"

      - name: Verify 63 Tracks
        run: |
          grep -oE "require\(['\"]\./assets/tracks/.*\.jpg['\"]\)" App.js | sed -E "s/.*tracks\///;s/['\"\)]//g" | sort > /tmp/need.txt
          ls assets/tracks/ | sort > /tmp/have.txt || touch /tmp/have.txt
          echo "Need: $(wc -l < /tmp/need.txt) Have: $(wc -l < /tmp/have.txt)"
          comm -23 /tmp/need.txt /tmp/have.txt || true
          if [ $(comm -23 /tmp/need.txt /tmp/have.txt | wc -l) -gt 0 ]; then echo "❌ 爭圖"; comm -23 /tmp/need.txt /tmp/have.txt; exit 1; fi

      - name: Expo prebuild
        run: npx expo prebuild --clean

      - name: Fix minSdk 23 -> 24
        run: |
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle || true

      - name: Use Permanent Keystore 40:0C:73 from Secrets
        env:
          PWD: ${{ secrets.KEYSTONE_PASSWORD }}
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          ls -lh android/app/release.keystore
          keytool -list -v -keystore android/app/release.keystore -storepass "$PWD" 2>&1 | grep -E "SHA1|Alias" || true

      - name: Inject signing with Secrets 40:0C:73 FIX #
        env:
          PWD: ${{ secrets.KEYSTONE_PASSWORD }}
          ALIAS: ${{ secrets.KEYSTONE_ALIAS }}
        run: |
          ESC=$(printf '%s' "$PWD" | sed 's/#/\\#/g')
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=$ALIAS" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=$ESC" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=$ESC" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=$ALIAS" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=$ESC" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=$ESC" >> android/gradle.properties
          # 鎖死 build.gradle 唔好用Expo臨時匙
          sed -i "s|storeFile file.*|storeFile file('release.keystore')|g" android/app/build.gradle || true
          cat android/gradle.properties | tail -n 10

      - name: Build AAB + APK FORCED 40
        env:
          PWD: ${{ secrets.KEYSTONE_PASSWORD }}
          ALIAS: ${{ secrets.KEYSTONE_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease -PMYAPP_RELEASE_STORE_FILE=release.keystore -PMYAPP_RELEASE_KEY_ALIAS=$ALIAS -PMYAPP_RELEASE_STORE_PASSWORD="$PWD" -PMYAPP_RELEASE_KEY_PASSWORD="$PWD" -PMYAPP_UPLOAD_STORE_FILE=release.keystore -PMYAPP_UPLOAD_KEY_ALIAS=$ALIAS -PMYAPP_UPLOAD_STORE_PASSWORD="$PWD" -PMYAPP_UPLOAD_KEY_PASSWORD="$PWD"

      - name: Verify AAB is 40
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep SHA1
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -q "40:0C:73" && echo "✅ 係40可以上架" || (echo "❌ 仲係5E唔係40" && exit 1)

      - name: Upload AAB For Play
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-63tracks-AAB-40-0C-73-for-play
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK For Test
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-63tracks-APK-40-0C-73-for-test
          path: android/app/build/outputs/apk/release/app-release.apk
