name: Build AAB for Play Store
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Expo prebuild clean
        run: npx expo prebuild --clean

      - name: Generate Release Keystore
        run: |
          cd android
          keytool -genkey -v -keystore app/release.keystore -alias lapgo -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=LapGo, OU=Dev, O=LapGo, L=HK, S=HK, C=HK"
          cp app/release.keystore release.keystore

      - name: Force inject release signing + minSdk 24
        run: |
          python3 << 'PY'
          import pathlib
          p = pathlib.Path('android/app/build.gradle')
          txt = p.read_text()
          # 1. 注入 release signing
          if "storeFile file('release.keystore')" not in txt:
              txt = txt.replace("signingConfigs {", "signingConfigs {\n        release {\n            storeFile file('release.keystore')\n            storePassword '123456'\n            keyAlias 'lapgo'\n            keyPassword '123456'\n        }")
          txt = txt.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          # 2. 強制 minSdk 24 - 呢個就係而家解決你Google嗰個紅字
          txt = txt.replace("minSdkVersion 23", "minSdkVersion 24")
          txt = txt.replace("minSdkVersion = 23", "minSdkVersion = 24")
          txt = txt.replace("minSdk 23", "minSdk 24")
          # Expo 新版可能用 minSdkVersion 21，都一律改24
          import re
          txt = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', txt)
          txt = re.sub(r'minSdk\s+\d+', 'minSdk 24', txt)
          p.write_text(txt)
          print("Patched build.gradle OK")
          PY

      - name: Build AAB for Play Store
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-keystore
          path: android/app/release.keystore
