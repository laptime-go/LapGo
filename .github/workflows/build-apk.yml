name: Build 63 Tracks AAB + APK - 40:0C:73
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install deps
        run: npm install
      - name: Generate tracks if script exists
        run: |
          mkdir -p assets/tracks
          if [ -f scripts/generate-tracks.js ]; then
            sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev || true
            npm install canvas
            node scripts/generate-tracks.js
          fi
      - name: Verify 63 Tracks
        run: |
          grep -oE "require\(['\"]\./assets/tracks/.*\.jpg['\"]\)" App.js | sed -E "s/.*tracks\///;s/['\"\)]//g" | sort > /tmp/need.txt
          ls assets/tracks/ | sort > /tmp/have.txt || true
          comm -23 /tmp/need.txt /tmp/have.txt || true
      - name: Expo prebuild
        run: npx expo prebuild --clean
      - name: Fix minSdk + Use 40 Keystore
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/app/debug.keystore
          cp android/app/release.keystore android/debug.keystore || true
          cp android/app/release.keystore android/app/release.keystore.bak
          ls -lh android/app/release.keystore android/app/debug.keystore
          keytool -list -v -keystore android/app/release.keystore -storepass 123456 2>&1 | grep -E "SHA1|Alias"
          # 暴力將build.gradle所有debug.keystore改做release.keystore
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/debug.keystore/release.keystore/g' android/app/build.gradle
          sed -i "s/storeFile file.*/storeFile file('release.keystore')/g" android/app/build.gradle
          echo "---- signingConfigs ----"
          grep -n "release.keystore\|signingConfigs\|storeFile\|storePassword\|keyAlias" android/app/build.gradle | head -n 40
      - name: Inject signing 40 + 123456
        run: |
          ALIAS=${{ secrets.KEYSTONE_ALIAS }}
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=$ALIAS" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=$ALIAS" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=123456" >> android/gradle.properties
          cat android/gradle.properties | tail -n 12
      - name: Build AAB + APK FORCED 40
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease -PMYAPP_RELEASE_STORE_FILE=release.keystore -PMYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }} -PMYAPP_RELEASE_STORE_PASSWORD=123456 -PMYAPP_RELEASE_KEY_PASSWORD=123456 -PMYAPP_UPLOAD_STORE_FILE=release.keystore -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }} -PMYAPP_UPLOAD_STORE_PASSWORD=123456 -PMYAPP_UPLOAD_KEY_PASSWORD=123456 --info | grep -i "signing\|release.keystore\|40:0C" || true
          ./gradlew bundleRelease assembleRelease -PMYAPP_RELEASE_STORE_FILE=release.keystore -PMYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }} -PMYAPP_RELEASE_STORE_PASSWORD=123456 -PMYAPP_RELEASE_KEY_PASSWORD=123456 -PMYAPP_UPLOAD_STORE_FILE=release.keystore -PMYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }} -PMYAPP_UPLOAD_STORE_PASSWORD=123456 -PMYAPP_UPLOAD_KEY_PASSWORD=123456
      - name: Verify AAB is 40
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep SHA1
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -q "40:0C:73" && echo "✅ 係40可以上架" || (echo "❌ 仲係5E" && exit 1)
      - name: Upload AAB For Play
        uses: actions/upload-artifact@v4
        with: { name: lapgo-63tracks-AAB-40-0C-73-for-play, path: android/app/build/outputs/bundle/release/app-release.aab }
      - name: Upload APK For Test
        uses: actions/upload-artifact@v4
        with: { name: lapgo-63tracks-APK-40-0C-73-for-test, path: android/app/build/outputs/apk/release/app-release.apk }
