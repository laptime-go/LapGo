name: Build 63 Tracks AAB + APK - 40:0C:73
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install deps
        run: npm install
      - name: Generate tracks
        run: |
          mkdir -p assets/tracks
          if [ -f scripts/generate-tracks.js ]; then
            sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev || true
            npm install canvas
            node scripts/generate-tracks.js
          fi
      - name: Expo prebuild
        run: npx expo prebuild --clean
      - name: Fix Keystore Password Inside GitHub - NO PC NEED
        env:
          OLD_PWD: ${{ secrets.KEYSTONE_OLD }}
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/app/debug.keystore
          echo "=== Before fix ==="
          keytool -list -v -keystore android/app/release.keystore -storepass 123456 2>&1 | grep -E "Alias|SHA1"
          ALIAS=$(keytool -list -v -keystore android/app/release.keystore -storepass 123456 2>&1 | grep "Alias name:" | head -n1 | cut -d: -f2 | xargs)
          echo "ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "Found alias $ALIAS"
          echo "Trying to change keyPassword from OLD to 123456..."
          keytool -keypasswd -keystore android/app/release.keystore -alias "$ALIAS" -storepass 123456 -keypass "$OLD_PWD" -new 123456 2>&1 || echo "OLD_PWD failed, trying 123456 itself..."
          keytool -keypasswd -keystore android/app/release.keystore -alias "$ALIAS" -storepass 123456 -keypass 123456 -new 123456 2>&1 || true
          echo "=== After fix ==="
          keytool -list -v -keystore android/app/release.keystore -storepass 123456 2>&1 | grep -E "Alias|SHA1"
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/debug.keystore/release.keystore/g' android/app/build.gradle
          # 硬寫死
          cat > /tmp/patch.js << 'JS'
          const fs=require('fs');
          let p=process.env.FOUND_ALIAS||'my-key-alias';
          let g=fs.readFileSync('android/app/build.gradle','utf8');
          g=g.replace(/signingConfigs\s*\{[\s\S]*?release\s*\{[\s\S]*?\}[\s\S]*?\}/m, `signingConfigs {
                  debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' }
                  release { storeFile file('release.keystore'); storePassword '123456'; keyAlias '${p}'; keyPassword '123456' }
              }`);
          fs.writeFileSync('android/app/build.gradle',g);
          JS
          FOUND_ALIAS=$ALIAS node /tmp/patch.js
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=$ALIAS" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=$ALIAS" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=123456" >> android/gradle.properties
      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
      - name: Verify AAB is 40
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep SHA1
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -q "40:0C:73" && echo "✅ 係40可以上架" || (echo "❌ 唔係40" && exit 1)
      - name: Upload AAB For Play
        uses: actions/upload-artifact@v4
        with: { name: lapgo-63tracks-AAB-40-0C-73-for-play, path: android/app/build/outputs/bundle/release/app-release.aab }
      - name: Upload APK For Test
        uses: actions/upload-artifact@v4
        with: { name: lapgo-63tracks-APK-40-0C-73-for-test, path: android/app/build/outputs/apk/release/app-release.apk }
