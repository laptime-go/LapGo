name: Build APK Store Clean Preview (11 Tracks For Google Screenshot)
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Expo prebuild clean
        run: npx expo prebuild --clean --no-install

      - name: Filter to 11 Tracks For Google (Remove Tuen Mun)
        run: |
          echo "Before filter:"
          find src -type f -name "*.json" -o -name "*.js" -o -name "*.ts" | xargs grep -l "Tuen\|屯門\|TMC" 2>/dev/null | head -20 || true
          # === 11條白名單過審版 ===
          # 1. 如果你有 tracks.json / config，直接刪走屯門
          if [ -f "src/data/tracks.json" ]; then
            echo "Filtering src/data/tracks.json"
            cat src/data/tracks.json | grep -v -i "tuen\|屯門\|TMC\|Tuen Mun Road" > /tmp/tracks.json || true
            mv /tmp/tracks.json src/data/tracks.json || true
          fi
          # 2. 通用暴力過濾：成個src入面註釋掉屯門
          find src -type f \( -name "*.js" -o -name "*.ts" -o -name "*.tsx" \) -exec sed -i '/Tuen Mun/d; /屯門/d; /TMC/d; /tuen-mun/d; /TuenMun/d' {} \; || true
          echo "After filter - should be 11 tracks only"
          grep -r "Tuen\|屯門" src --include="*.js" --include="*.ts" --include="*.tsx" -n || echo "✅ 100% Clean - 11 tracks - No Tuen Mun"

      - name: Fix minSdk 23 -> 24
        run: |
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdk 23/minSdk 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/app/build.gradle
          sed -i 's/minSdk = 23/minSdk = 24/g' android/app/build.gradle
          find android -name "*.gradle" -exec sed -i 's/minSdkVersion 23/minSdkVersion 24/g' {} \; || true

      - name: Use Permanent Keystore 40:0C:73 NEW
        run: |
          echo "Using NEW keystore 40:0C:73 from repo"
          ls -lh release.keystore
          mkdir -p android/app
          cp release.keystore android/release.keystore
          cp release.keystore android/app/release.keystore
          keytool -list -v -keystore release.keystore -storepass 123456 | grep -E "Alias|SHA1|Creation"
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=lapgo" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=lapgo" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=123456" >> android/gradle.properties

      - name: Build APK for Google Screenshot
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-store-clean-11tracks-for-google-screenshot
          path: android/app/build/outputs/apk/release/app-release.apk
