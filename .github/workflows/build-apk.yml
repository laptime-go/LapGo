name: Build APK Self Use

on:
  workflow_dispatch: # 手動按先build，唔會每次push都build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Expo prebuild clean
        run: npx expo prebuild --clean --no-install

      - name: Fix minSdk 23 -> 24
        run: |
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdk 23/minSdk 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/app/build.gradle || true
          sed -i 's/minSdk = 23/minSdk = 24/g' android/app/build.gradle || true

      - name: Use Permanent Keystore 90:BA
        run: |
          ls -lh release.keystore
          mkdir -p android/app
          cp release.keystore android/release.keystore
          cp release.keystore android/app/release.keystore
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=lapgo" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=lapgo" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=123456" >> android/gradle.properties

      - name: Build APK for Self Use
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-self-apk-tuenmun
          path: android/app/build/outputs/apk/release/app-release.apk
