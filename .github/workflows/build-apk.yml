name: Build 63 Tracks AAB + APK - 40:0C:73 lapgo
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: npm install

      - name: Force app.json to 36 + v5 BEFORE prebuild
        run: |
          node -e "
          const fs=require('fs');
          let j=JSON.parse(fs.readFileSync('app.json','utf8'));
          j.expo=j.expo||{};
          j.expo.android=j.expo.android||{};
          j.expo.android.compileSdkVersion=36;
          j.expo.android.targetSdkVersion=36;
          j.expo.android.minSdkVersion=24;
          j.expo.android.versionCode=5;
          j.expo.version='1.0.4';
          fs.writeFileSync('app.json', JSON.stringify(j,null,2));
          console.log('patched to 36 v5');
          "

      - name: Generate tracks if script exists
        run: |
          mkdir -p assets/tracks
          if [ -f scripts/generate-tracks.js ]; then
            sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev || true
            npm install canvas
            node scripts/generate-tracks.js
          fi
          echo "Have $(ls assets/tracks/*.jpg 2>/dev/null | wc -l) images"

      - name: Verify 63 Tracks
        run: |
          grep -oE "require\(['\"]\./assets/tracks/.*\.jpg['\"]\)" App.js | sed -E "s/.*tracks\///;s/['\"\)]//g" | sort > /tmp/need.txt
          ls assets/tracks/ | sort > /tmp/have.txt || touch /tmp/have.txt
          echo "Need: $(wc -l < /tmp/need.txt) Have: $(wc -l < /tmp/have.txt)"
          if [ $(comm -23 /tmp/need.txt /tmp/have.txt | wc -l) -gt 0 ]; then echo "❌ 爭圖"; comm -23 /tmp/need.txt /tmp/have.txt; exit 1; fi

      - name: Expo prebuild
        run: npx expo prebuild --clean

      - name: ULTIMATE FORCE Fix API 36 - python brute force
        run: |
          python3 - << 'PY'
          import pathlib, re
          for p in pathlib.Path("android").rglob("*.gradle"):
              t=p.read_text()
              t=re.sub(r'compileSdkVersion\s*=?\s*34', 'compileSdkVersion = 36', t)
              t=re.sub(r'targetSdkVersion\s*=?\s*34', 'targetSdkVersion = 36', t)
              t=re.sub(r'compileSdk\s*34', 'compileSdk 36', t)
              t=re.sub(r'targetSdk\s*34', 'targetSdk 36', t)
              # ext block
              t=t.replace('compileSdkVersion 34','compileSdkVersion 36').replace('targetSdkVersion 34','targetSdkVersion 36')
              t=t.replace(' 34', ' 36')
              # minSdk 23 -> 24
              t=re.sub(r'minSdkVersion\s*=?\s*23', 'minSdkVersion = 24', t)
              p.write_text(t)
          ap=pathlib.Path("android/app/build.gradle")
          s=ap.read_text()
          s=re.sub(r'versionCode \d+', 'versionCode 5', s)
          s=re.sub(r'versionName ".*?"', 'versionName "1.0.4"', s)
          ap.write_text(s)
          print("forced all to 36 and v5")
          PY
          echo "=== AFTER MUST BE 36 v5 ==="
          grep -R "targetSdk\|compileSdk\|versionCode" android/build.gradle android/app/build.gradle | head -30

      - name: Use Permanent Keystore 40:0C:73 lapgo
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore android/app/upload-keystore.jks
          echo "=== THIS BUILD SHOULD BE 40 ==="
          keytool -list -v -keystore android/app/release.keystore -alias ${{ secrets.KEYSTONE_ALIAS }} -storepass ${{ secrets.KEYSTONE_PASSWORD }} | grep -E "Alias name|SHA1"

      - name: Inject signing 40 from Secrets
        run: |
          sed -i '/MYAPP_RELEASE/d' android/gradle.properties || true
          sed -i '/MYAPP_UPLOAD/d' android/gradle.properties || true
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties

      - name: Build AAB + APK
        run: |
          cd android
          cat > /tmp/fix.py << 'PY'
          import pathlib, re
          p = pathlib.Path("app/build.gradle").read_text()
          new_block = """
          signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
              release {
                  storeFile file('release.keystore')
                  storePassword System.getenv("KS_PASS") ?: "123456"
                  keyAlias System.getenv("KS_ALIAS") ?: "lapgo"
                  keyPassword System.getenv("KS_PASS") ?: "123456"
              }
          }
          """
          p = re.sub(r'signingConfigs\s*\{.*?^\s*\}\s*\n\s*buildTypes', new_block + '\nbuildTypes', p, flags=re.MULTILINE|re.DOTALL)
          if 'signingConfig signingConfigs.debug' in p:
              p = p.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          pathlib.Path("app/build.gradle").write_text(p)
          print("Patched to release")
          PY
          python3 /tmp/fix.py
          chmod +x gradlew
          KS_PASS=${{ secrets.KEYSTONE_PASSWORD }} KS_ALIAS=${{ secrets.KEYSTONE_ALIAS }} ./gradlew bundleRelease assembleRelease --no-daemon
          echo "=== FINAL MUST BE 40:0C:73 / v5 / 36 ==="
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep SHA1

      - name: Upload AAB+APK to Release - 0MB 不計500MB
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lapgo-v5-api36-${{ github.run_number }}
          name: lapgo 63tracks v5 API36 #${{ github.run_number }}
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
