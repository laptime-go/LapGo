name: Build 63 Tracks AAB + APK - 40:0C:73
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Generate tracks if script exists
        run: |
          mkdir -p assets/tracks
          if [ -f scripts/generate-tracks.js ]; then
            sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev || true
            npm install canvas
            node scripts/generate-tracks.js
          else
            echo "No generate script, skip"
          fi
          echo "Have $(ls assets/tracks/*.jpg 2>/dev/null | wc -l) images"

      - name: Verify 63 Tracks
        run: |
          grep -oE "require\(['\"]\./assets/tracks/.*\.jpg['\"]\)" App.js | sed -E "s/.*tracks\///;s/['\"\)]//g" | sort > /tmp/need.txt
          ls assets/tracks/ | sort > /tmp/have.txt || touch /tmp/have.txt
          echo "Need: $(wc -l < /tmp/need.txt) Have: $(wc -l < /tmp/have.txt)"
          comm -23 /tmp/need.txt /tmp/have.txt || true
          if [ $(comm -23 /tmp/need.txt /tmp/have.txt | wc -l) -gt 0 ]; then echo "❌ 爭圖"; comm -23 /tmp/need.txt /tmp/have.txt; exit 1; fi

      - name: Expo prebuild
        run: npx expo prebuild --clean

      - name: Fix minSdk 23 -> 24
        run: |
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle || true

      - name: Use Permanent Keystore 40:0C:73 from Secrets - FIXED
        env:
          OLD_PWD: ${{ secrets.KEYSTONE_OLD }}
          NEW_PWD: ${{ secrets.KEYSTONE_PASSWORD }}
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/release.keystore
          cp android/app/release.keystore android/app/debug.keystore
          ls -lh android/app/release.keystore
          ALIAS="${{ secrets.KEYSTONE_ALIAS }}"
          if [ -z "$ALIAS" ]; then
            ALIAS=$(keytool -list -v -keystore android/app/release.keystore -storepass "$NEW_PWD" 2>&1 | grep "Alias name:" | head -n1 | cut -d: -f2 | xargs)
          fi
          echo "ALIAS=$ALIAS"
          # 關鍵：將keyPassword改成同storePassword一樣，解決 incorrect -> 5E 問題
          keytool -keypasswd -keystore android/app/release.keystore -alias "$ALIAS" -storepass "$NEW_PWD" -keypass "$OLD_PWD" -new "$NEW_PWD" 2>&1 || echo "keypasswd skip"
          keytool -list -v -keystore android/app/release.keystore -storepass "$NEW_PWD" 2>&1 | grep -E "Alias|SHA1"
          echo "ALIAS=$ALIAS" >> $GITHUB_ENV

      - name: Inject signing with Secrets 40:0C:73
        run: |
          ALIAS="${{ env.ALIAS }}"
          if [ -z "$ALIAS" ]; then ALIAS="${{ secrets.KEYSTONE_ALIAS }}"; fi
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=$ALIAS" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=$ALIAS" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}" >> android/gradle.properties
          cat android/gradle.properties | grep MYAPP

      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Verify APK is 40 - 安心Check
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | tee /tmp/c.txt
          grep -i "40:0C:73" /tmp/c.txt && echo "✅ 係40:0C:73 + 63圖齊" || (echo "❌ 唔係40" && exit 1)

      - name: Upload AAB For Play
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-63tracks-AAB-40-0C-73-for-play
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK For Test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-63tracks-APK-40-0C-73-for-test
          path: android/app/build/outputs/apk/release/app-release.apk
