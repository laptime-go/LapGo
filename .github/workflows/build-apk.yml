name: Build 63 Tracks AAB + APK - 40:0C:73
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: npm install

      - name: Generate tracks if script exists
        run: |
          mkdir -p assets/tracks
          if [ -f scripts/generate-tracks.js ]; then
            sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev || true
            npm install canvas
            node scripts/generate-tracks.js
          fi
          echo "Have $(ls assets/tracks/*.jpg 2>/dev/null | wc -l) images"

      - name: Verify 63 Tracks
        run: |
          grep -oE "require\(['\"]\./assets/tracks/.*\.jpg['\"]\)" App.js | sed -E "s/.*tracks\///;s/['\"\)]//g" | sort > /tmp/need.txt
          ls assets/tracks/ | sort > /tmp/have.txt || touch /tmp/have.txt
          echo "Need: $(wc -l < /tmp/need.txt) Have: $(wc -l < /tmp/have.txt)"
          if [ $(comm -23 /tmp/need.txt /tmp/have.txt | wc -l) -gt 0 ]; then echo "❌ 爭圖"; exit 1; fi

      - name: Expo prebuild
        run: npx expo prebuild --clean

      - name: Fix Keystore + 40 Signature - FINAL GREEN
        env:
          OLD_PWD: ${{ secrets.KEYSTONE_OLD }}
          NEW_PWD: ${{ secrets.KEYSTONE_PASSWORD }}
        run: |
          mkdir -p android/app
          printf '%s' "${{ secrets.KEYSTONE_B64 }}" | tr -d '\n\r ' | base64 --decode > android/app/release.keystore
          ALIAS="${{ secrets.KEYSTONE_ALIAS }}"
          if [ -z "$ALIAS" ]; then ALIAS=$(keytool -list -v -keystore android/app/release.keystore -storepass "$NEW_PWD" 2>&1 | grep "Alias name:" | head -n1 | cut -d: -f2 | xargs); fi
          echo "ALIAS=$ALIAS" >> $GITHUB_ENV
          keytool -keypasswd -keystore android/app/release.keystore -alias "$ALIAS" -storepass "$NEW_PWD" -keypass "$OLD_PWD" -new "$NEW_PWD" 2>&1 || true
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle || true
          # 硬寫死 signingConfigs，呢招係你之前綠色嗰份work嘅
          cat > /tmp/p.js << 'JS'
          const fs=require('fs');let p=process.env.ALIAS;let np=process.env.NEW_PWD;let g=fs.readFileSync('android/app/build.gradle','utf8');
          g=g.replace(/signingConfigs\s*\{[\s\S]*?release\s*\{[\s\S]*?\}[\s\S]*?\}/m,`signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } release { storeFile file('release.keystore'); storePassword '${np}'; keyAlias '${p}'; keyPassword '${np}' } }`);
          fs.writeFileSync('android/app/build.gradle',g);
          JS
          ALIAS=$ALIAS NEW_PWD=$NEW_PWD node /tmp/p.js

      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease

      - name: Verify is 40
        if: always()
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | tee /tmp/c.txt
          grep -i "40:0C:73" /tmp/c.txt && echo "✅ 係40 + 63圖齊" || (echo "❌ 仲係5E"; cat /tmp/c.txt; exit 1)

      - name: Upload AAB For Play
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: lapgo-63tracks-AAB-40-0C-73-for-play, path: android/app/build/outputs/bundle/release/app-release.aab }
      - name: Upload APK For Test
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: lapgo-63tracks-APK-40-0C-73-for-test, path: android/app/build/outputs/apk/release/app-release.apk }
