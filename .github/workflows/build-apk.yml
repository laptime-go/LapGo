name: Build 63 Tracks AAB + APK - 40:0C:73
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - name: Install deps
        run: npm install
      - name: Generate tracks if script exists
        run: |
          mkdir -p assets/tracks
          if [ -f scripts/generate-tracks.js ]; then
            sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev || true
            npm install canvas
            node scripts/generate-tracks.js
          fi
      - name: Expo prebuild
        run: npx expo prebuild --clean
      - name: Fix minSdk
        run: sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle || true
      - name: Use Permanent Keystore 40:0C:73 from Secrets
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTONE_B64 }}" | base64 -d > android/app/release.keystore
          keytool -list -v -keystore android/app/release.keystore -storepass '${{ secrets.KEYSTONE_PASSWORD }}' | grep SHA1
      - name: Inject signing Fixed for #
        run: |
          PASS='${{ secrets.KEYSTONE_PASSWORD }}'
          ESC=$(printf '%s' "$PASS" | sed 's/#/\\#/g')
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=$ESC" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=$ESC" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=$ESC" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=$ESC" >> android/gradle.properties
      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease
      - name: Verify AAB is 40
        run: |
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep SHA1
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -q "40:0C:73" && echo "✅ 係40可以上架" || (echo "❌ 仲係5E" && exit 1)
      - name: Upload AAB For Play
        uses: actions/upload-artifact@v4
        with: { name: lapgo-63tracks-AAB-40-0C-73-for-play, path: android/app/build/outputs/bundle/release/app-release.aab }
      - name: Upload APK For Test
        uses: actions/upload-artifact@v4
        with: { name: lapgo-63tracks-APK-40-0C-73-for-test, path: android/app/build/outputs/apk/release/app-release.apk }
