name: Build 90 Tracks AAB + APK - 40:0C:73
on:
  workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system deps for canvas
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev

      - name: Install deps
        run: npm install && npm install canvas

      - name: Auto Generate 90 GREEN NEON Tracks
        run: |
          mkdir -p assets/tracks
          cat > /tmp/gen.js << 'JS'
          const {createCanvas} = require('canvas');
          const fs=require('fs'), path=require('path');
          const tracks=['zic','gic','guia','sic','tianma','ningbo','zhuzhou','goldenport','chengdu','wuhan','ordos','shaoxing','zhengzhou','v1','pingtan','guangzhou','jingsu','fugang','fuji','suzuka','motegi','okayama','sugo','tsukuba','autopolis','ebisu','tokachi','sendai','mine','central','sepang','buriram','bira','bangsaen','sentul','clark','inje','korea','bathurst','sydney','phillip','dubai','yas','bahrain','losail','buddh','sepang-kart','buriram-kart','monza','spa','nurburgring','lemans','silverstone','monaco','laguna','daytona','cota','interlagos','zandvoort','imola','catalunya','redbull','hungaroring'];
          const dir='assets/tracks';
          tracks.forEach(id=>{
            const p=path.join(dir, id+'.jpg');
            if(fs.existsSync(p) && fs.statSync(p).size>5000) return; // 已有真圖就唔replace
            const c=createCanvas(800,500), ctx=c.getContext('2d');
            ctx.fillStyle='#000'; ctx.fillRect(0,0,800,500);
            ctx.strokeStyle='#00ff88'; ctx.lineWidth=6; ctx.shadowColor='#00ff88'; ctx.shadowBlur=18;
            ctx.strokeRect(15,15,770,470);
            ctx.shadowBlur=20; ctx.fillStyle='#00ff88'; ctx.font='bold 70px Arial'; ctx.textAlign='center';
            ctx.fillText(id.toUpperCase(),400,260);
            ctx.shadowBlur=0; ctx.fillStyle='#666'; ctx.font='18px Arial'; ctx.fillText('LAPGO • GREEN NEON • '+id,400,310);
            fs.writeFileSync(p, c.toBuffer('image/jpeg',{quality:0.9}));
            console.log('NEON '+id+'.jpg');
          });
          JS
          node /tmp/gen.js
          echo "Total: $(ls assets/tracks/ | wc -l)"

      - name: Expo prebuild clean
        run: npx expo prebuild --clean --no-install
      - name: Fix minSdk
        run: sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle; sed -i 's/minSdk 23/minSdk 24/g' android/app/build.gradle || true
      - name: Use Keystore 40:0C:73
        run: |
          mkdir -p android/app
          cp release.keystore android/release.keystore
          cp release.keystore android/app/release.keystore
          keytool -list -v -keystore release.keystore -storepass 123456 | grep -E "Alias|SHA1"
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=lapgo" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=lapgo" >> android/gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=123456" >> android/gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=123456" >> android/gradle.properties
      - name: Build AAB + APK
        run: cd android && chmod +x gradlew && ./gradlew bundleRelease assembleRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-90tracks-AAB-40-0C-73-NEON
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lapgo-90tracks-APK-40-0C-73-NEON
          path: android/app/build/outputs/apk/release/app-release.apk
