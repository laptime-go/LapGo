name: Build 63 Tracks AAB + APK - 40:0C:73
on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps
        run: npm install

      - name: Generate tracks if script exists
        run: |
          mkdir -p assets/tracks
          if [ -f scripts/generate-tracks.js ]; then
            sudo apt-get update && sudo apt-get install -y libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev librsvg2-dev || true
            npm install canvas
            node scripts/generate-tracks.js
          else
            echo "No generate script, skip"
          fi
          echo "Have $(ls assets/tracks/*.jpg 2>/dev/null | wc -l) images"

      - name: Verify 63 Tracks
        run: |
          grep -oE "require\(['\"]\./assets/tracks/.*\.jpg['\"]\)" App.js | sed -E "s/.*tracks\///;s/['\"\)]//g" | sort > /tmp/need.txt
          ls assets/tracks/ | sort > /tmp/have.txt || touch /tmp/have.txt
          echo "Need: $(wc -l < /tmp/need.txt) Have: $(wc -l < /tmp/have.txt)"
          comm -23 /tmp/need.txt /tmp/have.txt || true
          if [ $(comm -23 /tmp/need.txt /tmp/have.txt | wc -l) -gt 0 ]; then echo "❌ 爭圖"; comm -23 /tmp/need.txt /tmp/have.txt; exit 1; fi

      - name: Clean old keystores
        run: rm -rf android && rm -rf ~/.gradle/caches

      - name: Expo prebuild
        run: npx expo prebuild --clean

      - name: Fix minSdk 23 -> 24
        run: |
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion = 23/minSdkVersion = 24/g' android/app/build.gradle || true

      - name: Use Permanent Keystore 40:0C:73 from Secrets
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTONE_B64 }}" | base64 -d > android/app/release.keystore
          echo "${{ secrets.KEYSTONE_B64 }}" | base64 -d > android/release.keystore
          ls -lh android/app/release.keystore
          echo "=== KEYSTORE CONTENT ==="
          keytool -list -keystore android/app/release.keystore -storepass "${{ secrets.KEYSTONE_PASSWORD }}" || (echo "❌ PASSWORD/ALIAS錯" && exit 1)
          echo "=== SHA1 MUST BE 40:0C:73 ==="
          keytool -list -v -keystore android/app/release.keystore -storepass "${{ secrets.KEYSTONE_PASSWORD }}" | grep -A1 SHA1
          keytool -list -v -keystore android/app/release.keystore -storepass "${{ secrets.KEYSTONE_PASSWORD }}" | grep -q "40:0C:73" || (echo "❌ 呢把唔係40:0C:73，你個KEYSTONE_B64仲係舊5E" && exit 1)

      - name: Inject signing with Secrets 40:0C:73
        run: |
          rm -f android/app/debug.keystore
          cat >> android/gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}
          MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}
          MYAPP_RELEASE_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}
          MYAPP_UPLOAD_STORE_FILE=release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.KEYSTONE_PASSWORD }}
          android.injected.signing.store.file=$PWD/android/app/release.keystore
          android.injected.signing.store.password=${{ secrets.KEYSTONE_PASSWORD }}
          android.injected.signing.key.alias=${{ secrets.KEYSTONE_ALIAS }}
          android.injected.signing.key.password=${{ secrets.KEYSTONE_PASSWORD }}
          EOF
          cat android/gradle.properties

      - name: Build AAB + APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --stacktrace

      - name: Verify final AAB is 40:0C:73
        run: |
          sudo apt-get install -y unzip
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          unzip -p $AAB META-INF/*.RSA > /tmp/final.RSA 2>/dev/null || unzip -p $AAB META-INF/*.DSA > /tmp/final.RSA
          echo "=== FINAL AAB CERT ==="
          keytool -printcert -file /tmp/final.RSA
          keytool -printcert -file /tmp/final.RSA | grep -q "40:0C:73" || (echo "❌ FINAL AAB IS NOT 40:0C:73 - 仲係5E，簽名失敗" && exit 1)
          echo "✅ VERIFIED 40:0C:73 - 可以
