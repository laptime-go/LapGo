name: Build 63 Tracks AAB 40-0C-73
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean old keystores - 刪舊5E
        run: |
          rm -f release.keystore android/release.keystore android/app/release.keystore
          echo "舊key已刪"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        run: npm install

      - name: Generate tracks if script exists
        run: |
          if [ -f scripts/generate-tracks.js ]; then
            node scripts/generate-tracks.js
          fi

      - name: Expo prebuild -- 先起Android
        run: npx expo prebuild --platform android --clean

      - name: Use Permanent Keystore 40:0C:73 - 喺prebuild之後先寫入!!!
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTONE_B64 }}" | base64 --decode > android/app/release.keystore
          cp android/app/release.keystore android/release.keystore
          cp android/app/release.keystore ./release.keystore
          ls -lh android/app/release.keystore
          keytool -list -v -keystore android/app/release.keystore -storepass ${{ secrets.KEYSTONE_PASS }} | grep -E "Alias|SHA1"

      - name: Inject signing
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=${{ secrets.KEYSTONE_ALIAS }}" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTONE_PASS }}" >> android
