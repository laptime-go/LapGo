name: Rotate 123456 -> Strong Password
on: workflow_dispatch
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Change password and output new B64
        run: |
          echo "${{ secrets.KEYSTONE_B64 }}" | base64 -d > /tmp/old.jks
          echo "=== 舊密碼 123456 驗證 ==="
          keytool -list -keystore /tmp/old.jks -storepass 123456 | grep SHA1
          
          # 轉store密碼
          keytool -storepasswd -keystore /tmp/old.jks -storepass 123456 -new 'LapGo2026#40Secure!'
          # 轉key密碼 (alias係 lapgo，圖入面見到)
          keytool -keypasswd -keystore /tmp/old.jks -alias lapgo -keypass 123456 -new 'LapGo2026#40Secure!' -storepass 'LapGo2026#40Secure!'
          
          echo "=== 新密碼驗證 ==="
          keytool -list -v -keystore /tmp/old.jks -storepass 'LapGo2026#40Secure!' | grep -E "Alias|SHA1"
          
          echo "=== 下面係新B64，成段Copy去更新 Secrets ==="
          base64 -w 0 /tmp/old.jks > /tmp/new.b64
          cat /tmp/new.b64
          echo ""
          echo "=== 請將上面一堆字，更新去 KEYSTONE_B64 ==="
