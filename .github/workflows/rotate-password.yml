name: Rotate - Final
on: workflow_dispatch
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Rotate 123456 to strong
        run: |
          set +e
          echo "${{ secrets.KEYSTONE_B64 }}" | base64 -d > /tmp/old.jks
          echo "file size $(wc -c < /tmp/old.jks) bytes"
          
          keytool -list -keystore /tmp/old.jks -storepass 123456
          
          echo "--- 轉store密碼 ---"
          keytool -storepasswd -keystore /tmp/old.jks -storepass 123456 -new 'LapGo2026#40Secure!'
          
          echo "--- 搵alias ---"
          ALIAS=$(keytool -list -v -keystore /tmp/old.jks -storepass 'LapGo2026#40Secure!' | grep "Alias name:" | head -1 | awk '{print $3}')
          echo "Found alias: $ALIAS"
          
          echo "--- 轉key密碼 ---"
          keytool -keypasswd -keystore /tmp/old.jks -alias "$ALIAS" -keypass 123456 -new 'LapGo2026#40Secure!' -storepass 'LapGo2026#40Secure!'
          
          echo "--- 驗證新密碼同SHA1 ---"
          keytool -list -v -keystore /tmp/old.jks -storepass 'LapGo2026#40Secure!' | grep -E "Alias|SHA1"
          
          echo "--- NEW B64 (Copy呢段) ---"
          base64 -w 0 /tmp/old.jks
          echo ""
          echo "--- END ---"
