name: Rotate - Debug Version
on: workflow_dispatch
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Debug and rotate
        run: |
          B64="${{ secrets.KEYSTONE_B64 }}"
          echo "$B64" | base64 -d > /tmp/old.jks
          ls -lh /tmp/old.jks
          echo "嘗試密碼列表:"
          for P in '123456' 'LapGo2026#40Secure!' 'lapgo2026' 'LapGo2026' 'android'; do
            echo -n "  試 [$P] -> "
            if keytool -list -keystore /tmp/old.jks -storepass "$P" > /tmp/out.txt 2>&1; then
              echo "✅ 成功!"
              cat /tmp/out.txt | grep -E "Alias|SHA1|Valid"
              GOOD="$P"
              break
            else
              echo "錯"
            fi
          done
          
          if [ -z "$GOOD" ]; then
            echo "❌ 全部密碼都錯，keytool報錯："
            cat /tmp/out.txt
            exit 1
          fi
          
          echo "=== 用 $GOOD 轉做 LapGo2026#40Secure! ==="
          keytool -storepasswd -keystore /tmp/old.jks -storepass "$GOOD" -new 'LapGo2026#40Secure!'
          # 試晒兩個alias
          for ALIAS in lapgo android key0 upload; do
            keytool -keypasswd -keystore /tmp/old.jks -alias $ALIAS -keypass "$GOOD" -new 'LapGo2026#40Secure!' -storepass 'LapGo2026#40Secure!' 2>/dev/null && echo "轉alias $ALIAS 成功" && break
          done
          
          echo "=== 轉完驗證 ==="
          keytool -list -v -keystore /tmp/old.jks -storepass 'LapGo2026#40Secure!' | grep -E "Alias|SHA1"
          
          echo "=== 新B64 ==="
          base64 -w 0 /tmp/old.jks
