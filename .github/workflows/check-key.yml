name: Check What Key is in Secrets
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and check SHA1
        run: |
          echo "${{ secrets.KEYSTONE_B64 }}" | base64 -d > /tmp/my.keystore
          ls -lh /tmp/my.keystore
          keytool -list -v -keystore /tmp/my.keystore -storepass '${{ secrets.KEYSTONE_PASSWORD }}' | grep -E "Alias|SHA1|Valid"
