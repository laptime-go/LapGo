name: Find Real Password of 40 key
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Try all possible passwords
        run: |
          echo "${{ secrets.KEYSTONE_B64 }}" | base64 -d > /tmp/k.jks
          for P in 'LapGo2026#40Secure!' '123456' 'lapgo2026' 'LapGo2026' 'lapgo2026#40secure!' 'LapGo2026#40' 'LapGo2026#40Secure' 'password' 'android'; do
            echo "Trying: [$P] ..."
            if keytool -list -keystore /tmp/k.jks -storepass "$P" > /dev/null 2>&1; then
              echo "✅ FOUND! 真密碼係: $P"
              keytool -list -v -keystore /tmp/k.jks -storepass "$P" | grep -A2 "SHA1\|Alias"
              exit 0
            fi
          done
          echo "❌ 上面咁多個都唔啱"
